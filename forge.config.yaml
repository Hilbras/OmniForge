project:
  name: OmniForge

version:
  strategy: semver
  file: package.json
  tagPrefix: v

github:
  enabled: true
  repository: Hilbras/OmniForge

npm:
  enabled: true
  package: '@hilbras/omniforge'
  registry: https://registry.npmjs.org
  distTag: latest

pypi:
  enabled: false

checks:
  test: true
  lint: true
  build: true

order:
  - github
  - npm
