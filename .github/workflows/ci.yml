name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The declared floor is Node 22.12 — commander requires >=22.12.0 and
        # vitest ^22.12.0 — so that exact minor is tested rather than assumed. An
        # `engines` claim nobody runs is not a compatibility guarantee. 24 is the
        # current LTS; 26 is what this project is developed against.
        node: ['22.12', '24', '26']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # The integration tests execute the built CLI, so the build has to exist
      # before they run. With the build after the tests, a cold checkout either
      # skipped those tests or ran them against a stale dist/ — which is how
      # `does not provide an export named registerReleaseCommand` appeared on one
      # macOS job while the source and the committed dist both exported it.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # cli.md is generated from the built binary. Regenerating it here means a
      # changed help text fails CI instead of leaving the docs quietly wrong.
      - name: CLI docs are current
        run: npm run docs:check

      - name: Verify CLI starts
        run: node dist/cli/index.js --version

  pack:
    name: Verify package contents
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build

      # Coverage thresholds live in vitest.config.ts and already fail `npm test`,
      # so this step is about publishing the report rather than the gate.
      - name: Coverage
        run: npm run test:coverage

      # `files` in package.json must actually exclude tests, configs, and source.
      - name: Check what would be published
        run: npm pack --dry-run

      - name: Fail if forbidden paths are in the tarball
        run: |
          set -euo pipefail
          listing="$(npm pack --dry-run --json)"
          echo "$listing"
          for forbidden in 'tests/' 'src/' 'tasks/' 'node_modules/'; do
            if echo "$listing" | grep -q "$forbidden"; then
              echo "::error::tarball unexpectedly contains $forbidden"
              exit 1
            fi
          done
          echo "tarball contents are clean"
