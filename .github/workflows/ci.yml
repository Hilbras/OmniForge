name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify CLI starts
        run: node dist/cli/index.js --version

  pack:
    name: Verify package contents
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build

      # `files` in package.json must actually exclude tests, configs, and source.
      - name: Check what would be published
        run: npm pack --dry-run

      - name: Fail if forbidden paths are in the tarball
        run: |
          set -euo pipefail
          listing="$(npm pack --dry-run --json)"
          echo "$listing"
          for forbidden in 'tests/' 'src/' 'tasks/' 'node_modules/'; do
            if echo "$listing" | grep -q "$forbidden"; then
              echo "::error::tarball unexpectedly contains $forbidden"
              exit 1
            fi
          done
          echo "tarball contents are clean"
